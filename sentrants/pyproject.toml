[project]
name = "sentrants"
version = "0.1.0"
description = "A living swarm of Sentry customers"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sentrants = "sentrants.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentrants*"]

[tool.setuptools.package-data]
sentrants = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
